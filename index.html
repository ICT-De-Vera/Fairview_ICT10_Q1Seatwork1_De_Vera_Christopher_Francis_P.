<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seatwork 1</title>

    <!-- PyScript 2026.7.3 Core CDN -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double+Ink:wght@100..900&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: url('https://i.pinimg.com/originals/2c/79/79/2c79797f8479ee631db33049d97b91b7.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: #ffffff;
            font-family: "Bitcount Prop Double Ink", Arial, sans-serif;
        }
        .custom-card {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        .form-control, .form-select {
            background-color: #222222;
            color: #ffffff;
            border: 1px solid #555555;
        }
        .form-control:focus, .form-select:focus {
            background-color: #2b2b2b;
            color: #ffffff;
            border-color: #4d0d91;
            box-shadow: none;
        }
        .btn {
            background-color: #4d0d91;
            color: #ffffff;
            border: none;
        }
    </style>
</head>
<body class="py-4">

    <div class="container" style="max-width: 750px;">


        <!-- Part 1 Display Section -->
        <div id="home" class="custom-card p-4 mb-4">
            <h1 class="h2 mb-3 text-primary">Part 1: Profile & Variables</h1>
            <div class="profile-list lh-lg">
                <p class="mb-1"><strong class="text-info" id="name"></strong></p>
                <p class="mb-1"><strong class="text-info" id="age"></strong></p>
                <p class="mb-1"><strong class="text-info" id="height"></strong></p>
                <p class="mb-1"><strong class="text-info" id="student_type"></strong></p>
                <p class="mb-1"><strong class="text-info" id="best_friend"></strong></p>
                <p class="mb-1"><strong class="text-info" id="car_brand"></strong></p>
                <p class="mb-1"><strong class="text-info" id="color"></strong></p>
                <p class="mb-1"><strong class="text-info" id="shoe_size"></strong></p>
                <p class="mb-1"><strong class="text-info" id="countries"></strong></p>
                <p class="mb-1"><strong class="text-info" id="fruits"></strong></p>
                <p class="mb-1"><strong class="text-info" id="days"></strong></p>
            </div>
        </div>

        <!-- Part 2 Calculator Section -->
        <div id="calculator" class="custom-card p-4">
            <h2 class="h3 mb-3 text-primary">Part 2: Python Calculator</h2>
            <form id="calc-form" class="mb-3">
                <div class="row g-2 mb-3">
                    <div class="col-md-5">
                        <input type="number" step="any" id="num1" class="form-control" placeholder="Enter first number" required>
                    </div>
                    <div class="col-md-5">
                        <input type="number" step="any" id="num2" class="form-control" placeholder="Enter second number" required>
                    </div>
                    <div class="col-md-2">
                        <select id="operation" class="form-select">
                            <option value="+">Add</option>
                            <option value="-">Subtract</option>
                            <option value="×">Multiply</option>
                            <option value="÷">Divide</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn w-100" py-click="solve">Calculate</button>
            </form>
            
            <div id="output" class="mt-3 p-3 bg-dark rounded border border-secondary text-center">
            </div>
            <script type="py" src="main.py"></script>
        </div>

    </div>






    <div class="text-center mt-5">
        <p class="text-light">&copy; 2026 De Vera, Christopher Francis P. All rights reserved.</p>
    </div>
    <div id="sources" class="text-center mt-2">
        <p class="text-light">
            <a href="https://pyscript.net/" target="_blank" class="text-light">PyScript</a> |
            <a href="https://getbootstrap.com/" target="_blank" class="text-light">Bootstrap</a> |
            <a href="https://i.pinimg.com/originals/2c/79/79/2c79797f8479ee631db33049d97b91b7.gif" target="_blank" class="text-light">Background Image</a>
        </p>
    </div>

</body>
</html>
