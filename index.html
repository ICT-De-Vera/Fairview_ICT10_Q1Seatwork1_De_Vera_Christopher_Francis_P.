<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seatwork 1</title>
    <script src="https://pyscript.net/3.14/2024.1/pyscript.js"></script>
    <script type="py" src="./main.py"></script>
<style>
    body {
        background-image: url('https://wallpaperaccess.com/download/black-blue-shards-6220556');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
        margin: 0;
        padding: 0 8%;
        box-sizing: border-box;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 18px;
    }
    nav {
        background-color: transparent;
        overflow: hidden;
        display: flex;
        gap: 12px;
        padding: 24px 0;
    }
    button {
        background-color: #151515;
        color: white;
        padding: 12px 20px;
        text-decoration: none;
        font-size: 18px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #555;
    }
    #home,
    #calculator {
        max-width: 700px;
        margin: 40px auto;
        padding: 28px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 10px;
        box-sizing: border-box;
    }
    h1,
    h2 {
        font-size: 2rem;
        margin-top: 0;
    }
    input,
    select {
        padding: 12px;
        margin: 6px 0;
        font-size: 1rem;
        box-sizing: border-box;
    }
    #variable-display {
        margin-top: 16px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        white-space: pre-wrap;
    }
</style>
</head>
<body>
    <nav>
            <button href="#home">Home</button>
            <button href="#calculator">Calculator</button>
    </nav>
    <div id="home">
        <h1>Welcome</h1>
        <div id="welcome-message"></div>
        <div id="variable-display">Loading variables from main.py...</div>
     
    </div>    

    <div id="calculator">
        <div id="calculator-container">
            <h2>Calculator</h2>
            <form id="calculator-form">
                <input type="number" id="num1" placeholder="Enter first number" required>
                <input type="number" id="num2" placeholder="Enter second number" required>
                <select id="operation">
                    <option value="add">Add</option>
                    <option value="subtract">Subtract</option>
                    <option value="multiply">Multiply</option>
                    <option value="divide">Divide</option>
                </select>
                <br>
                <button type="button" onclick="calculate(event)">Calculate</button>
            </form>
            <div id="result"></div>

    </div>

    <script type="py">
        import main
        from js import document

        excluded = {"__builtins__", "__name__", "__file__", "__package__", "__spec__"}
        variables = []
        for name, value in vars(main).items():
            if not name.startswith("_") and name not in excluded and not callable(value):
                variables.append(f"{name} = {value!r}")

        display = document.getElementById("variable-display")
        display.textContent = "Variables from main.py:\n" + (
            "\n".join(variables) if variables else "No public variables found."
        )
    </script>
</body>
</html>
